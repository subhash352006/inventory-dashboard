      const aisles = ['Aisle 1', 'Aisle 2', 'Aisle 3', 'Aisle 4', 'Aisle 5', 'Aisle 6', 'Aisle 7', 'Aisle 8', 'Warehouse Bay A', 'Warehouse Bay B'];
      const shelves = ['Rack A', 'Rack B', 'Rack C', 'Rack D', 'Bin 01', 'Bin 02', 'Bin 03', 'Shelf 1', 'Shelf 2', 'Shelf 3'];

      ITEM_TEMPLATES.forEach((cat) => {
        cat.names.forEach((name, index) => {
          const id = idCounter++;
          const skuNumber = (1000 + id).toString();
          const sku = `${cat.prefix}-${skuNumber}`;
          const barcode = `890${cat.catId.toString().padStart(2, '0')}${skuNumber.padStart(8, '0')}`;

          const seedMod = (id * 17 + index * 31) % 100;
          let currentStock;
          let reorderPoint = 10 + ((id * 7) % 20);

          if (seedMod < 5) {
            currentStock = 0; // Out of stock
          } else if (seedMod < 22) {
            currentStock = Math.max(1, Math.floor(reorderPoint * 0.45)); // Low stock
          } else {
            currentStock = reorderPoint + 12 + ((id * 13) % 95); // Healthy
          }

          const costBasis = 3.5 + ((id * 4.3) % 75);
          const costPrice = parseFloat(costBasis.toFixed(2));
          const retailPrice = parseFloat((costBasis * (1.35 + ((id * 3) % 45) / 100)).toFixed(2));
          const supplier = SUPPLIERS[(id + index) % SUPPLIERS.length];
          const aisle = aisles[(cat.catId - 1 + ((id * 3) % aisles.length)) % aisles.length];
          const shelf = shelves[(index + id) % shelves.length];
          const location = `${aisle}, ${shelf}`;

          let auditStatus = 'pending';
          let lastAuditedDate = new Date(now.getTime() - ((id * 37) % 14) * 86400000);
          let discrepancyQty = 0;

          if (seedMod % 5 === 0) {
            auditStatus = 'audited';
            lastAuditedDate = new Date(now.getTime() - ((id * 7) % 12) * 3600000);
          } else if (seedMod % 13 === 0) {
            auditStatus = 'discrepancy';
            discrepancyQty = (seedMod % 2 === 0 ? 1 : -1) * (1 + (id % 4));
            lastAuditedDate = new Date(now.getTime() - ((id * 11) % 18) * 3600000);
          }

          items.push({
            id,
            sku,
            barcode,
            name,
            categoryId: cat.catId,
            category: cat.catName,
            currentStock,
            reorderPoint,
            costPrice,
            retailPrice,
            supplierId: supplier.id,
            supplierName: supplier.name,
            location,
            lastAudited: lastAuditedDate.toISOString(),
            auditStatus,
            discrepancyQty,
            updatedAt: lastAuditedDate.toISOString()
          });
        });
      });
      return items;
    }

    // --- RELATIONAL DATABASE LAYER & ASYNC REST API SIMULATOR ---
    class RelationalDatabaseStore {
      constructor() {
        this.products = [];
        this.auditLogs = [];
        this.init();
      }

      init() {
        const saved = localStorage.getItem('stocktrack_pro_items_v1');
        const savedLogs = localStorage.getItem('stocktrack_pro_logs_v1');
        if (saved) {
          try { this.products = JSON.parse(saved); } catch(e) { this.products = generateSeedInventory(); }
        } else {
          this.products = generateSeedInventory();
          this.persist();
        }

        if (savedLogs) {
          try { this.auditLogs = JSON.parse(savedLogs); } catch(e) { this.auditLogs = []; }
        } else {
          this.auditLogs = [
            {
              id: 'LOG-001',
              productId: 1,
              sku: 'ELC-1001',
              productName: 'Pro ANC Wireless Headphones',
              systemCount: 38,
              physicalCount: 38,
              discrepancy: 0,
              costImpact: 0,
              operatorName: 'Alex Rivera (Auditor #04)',
              timestamp: new Date(Date.now() - 3600000 * 2).toISOString(),
              notes: 'Audit verified. Full stock carton count matched exactly.',
              actionType: 'AUDIT_VERIFIED'
            }
          ];
          this.persistLogs();
        }
      }

      persist() {
        try { localStorage.setItem('stocktrack_pro_items_v1', JSON.stringify(this.products)); } catch(e) {}
      }

      persistLogs() {
        try { localStorage.setItem('stocktrack_pro_logs_v1', JSON.stringify(this.auditLogs)); } catch(e) {}
      }

      query({ categoryId, stockFilter, search, sortBy = 'id', sortOrder = 'asc', page = 1, pageSize = 25 }) {
        const start = performance.now();
        const cleanSearch = (search || '').trim().toLowerCase();
        const todayStr = new Date().toISOString().slice(0, 10);

        let results = this.products.filter(p => {
          if (categoryId && categoryId !== 'all' && p.categoryId !== parseInt(categoryId, 10)) return false;

          if (stockFilter === 'low_stock' && (p.currentStock > p.reorderPoint || p.currentStock === 0)) return false;
          if (stockFilter === 'out_of_stock' && p.currentStock > 0) return false;
          if (stockFilter === 'in_stock' && p.currentStock === 0) return false;
          if (stockFilter === 'pending_audit' && p.auditStatus !== 'pending') return false;
          if (stockFilter === 'audited_today' && (p.auditStatus !== 'audited' || !p.lastAudited.startsWith(todayStr))) return false;
          if (stockFilter === 'discrepancy' && p.auditStatus !== 'discrepancy') return false;

          if (cleanSearch) {
            const mSku = p.sku.toLowerCase().includes(cleanSearch);
            const mName = p.name.toLowerCase().includes(cleanSearch);
            const mBar = p.barcode.includes(cleanSearch);
            const mLoc = p.location.toLowerCase().includes(cleanSearch);
            const mSup = p.supplierName.toLowerCase().includes(cleanSearch);
            if (!mSku && !mName && !mBar && !mLoc && !mSup) return false;
          }
          return true;
        });

        results.sort((a, b) => {
          let vA = a[sortBy];
          let vB = b[sortBy];
          if (sortBy === 'inventoryValue') {
            vA = a.currentStock * a.retailPrice;
            vB = b.currentStock * b.retailPrice;
          }
          if (typeof vA === 'string') {
            return sortOrder === 'asc' ? vA.localeCompare(vB) : vB.localeCompare(vA);
          }
          return sortOrder === 'asc' ? vA - vB : vB - vA;
        });

        const totalCount = results.length;
        const pSize = pageSize === 'all' ? totalCount : pageSize;
        const startIdx = (page - 1) * pSize;
        const items = pageSize === 'all' ? results : results.slice(startIdx, startIdx + pSize);
        const executionMs = parseFloat((performance.now() - start).toFixed(2));

        return {
          items,
          totalCount,
          page,
          pageSize: pSize,
          totalPages: pageSize === 'all' ? 1 : Math.ceil(totalCount / pSize),
          executionMs,
          totalDatabaseRecords: this.products.length
        };
      }

      updateStock(id, newQty) {
        const idx = this.products.findIndex(p => p.id === parseInt(id, 10));
        if (idx === -1) throw new Error('Product not found');
        this.products[idx].currentStock = Math.max(0, newQty);
        this.products[idx].updatedAt = new Date().toISOString();
        this.persist();
        return this.products[idx];
      }

      reconcile(id, physicalCount, operator, notes) {
        const idx = this.products.findIndex(p => p.id === parseInt(id, 10));
        if (idx === -1) throw new Error('Product not found');
        const item = this.products[idx];
        const variance = physicalCount - item.currentStock;
        const nowIso = new Date().toISOString();

        this.products[idx].currentStock = physicalCount;
        this.products[idx].lastAudited = nowIso;
        this.products[idx].auditStatus = variance === 0 ? 'audited' : 'discrepancy';
        this.products[idx].discrepancyQty = variance;
        this.products[idx].updatedAt = nowIso;

        const logEntry = {
          id: `LOG-${Date.now()}-${Math.floor(Math.random() * 1000)}`,
          productId: item.id,
          sku: item.sku,
          productName: item.name,
          category: item.category,
          location: item.location,
          systemCount: item.currentStock,
          physicalCount,
          discrepancy: variance,
          costImpact: parseFloat((variance * item.costPrice).toFixed(2)),
          operatorName: operator,
          timestamp: nowIso,
          notes: notes || (variance === 0 ? 'Physical audit verified' : `Variance of ${variance} units`),
          actionType: variance === 0 ? 'AUDIT_VERIFIED' : 'DISCREPANCY_RECONCILED'
        };

        this.auditLogs.unshift(logEntry);
        this.persist();
        this.persistLogs();
        return { product: this.products[idx], logEntry };
      }

      create(data) {
        const newId = this.products.reduce((max, p) => Math.max(max, p.id), 0) + 1;
        const cat = CATEGORIES.find(c => c.id === parseInt(data.categoryId, 10)) || CATEGORIES[0];
        const sup = SUPPLIERS.find(s => s.id === parseInt(data.supplierId, 10)) || SUPPLIERS[0];

        const newP = {
          id: newId,
          sku: data.sku ? data.sku.toUpperCase() : `${cat.code}-${1000 + newId}`,
          barcode: data.barcode || `890${cat.id.toString().padStart(2, '0')}${(1000 + newId).toString().padStart(8, '0')}`,
          name: data.name,
          categoryId: cat.id,
          category: cat.name,
          currentStock: parseInt(data.currentStock || 0, 10),
          reorderPoint: parseInt(data.reorderPoint || 15, 10),
          costPrice: parseFloat(data.costPrice || 10),
          retailPrice: parseFloat(data.retailPrice || 20),
          supplierId: sup.id,
          supplierName: sup.name,
          location: data.location || 'Aisle 1, Rack A',
          lastAudited: new Date().toISOString(),
          auditStatus: 'pending',
          discrepancyQty: 0,
          updatedAt: new Date().toISOString()
        };

        this.products.unshift(newP);
        this.persist();
        return newP;
      }

      update(id, data) {
        const idx = this.products.findIndex(p => p.id === parseInt(id, 10));
        if (idx === -1) throw new Error('Not found');
        const cat = CATEGORIES.find(c => c.id === parseInt(data.categoryId, 10)) || CATEGORIES[0];
        const sup = SUPPLIERS.find(s => s.id === parseInt(data.supplierId, 10)) || SUPPLIERS[0];

        this.products[idx] = {
          ...this.products[idx],
          name: data.name,
          categoryId: cat.id,
          category: cat.name,
          currentStock: parseInt(data.currentStock, 10),
          reorderPoint: parseInt(data.reorderPoint, 10),
          costPrice: parseFloat(data.costPrice),
          retailPrice: parseFloat(data.retailPrice),
          supplierId: sup.id,
          supplierName: sup.name,
          location: data.location,
          updatedAt: new Date().toISOString()
        };
        this.persist();
        return this.products[idx];
      }

      delete(id) {
        const idx = this.products.findIndex(p => p.id === parseInt(id, 10));
        if (idx === -1) throw new Error('Not found');
        const del = this.products.splice(idx, 1)[0];
        this.persist();
        return del;
      }

      getMetrics() {
        const todayStr = new Date().toISOString().slice(0, 10);
        let totalSKUs = this.products.length;
        let totalStockUnits = 0;
        let totalInventoryValue = 0;
        let totalCostValuation = 0;
        let lowStockCount = 0;
        let outOfStockCount = 0;
        let auditedTodayCount = 0;
        let discrepancyCount = 0;

        for (let i = 0; i < totalSKUs; i++) {
          const p = this.products[i];
          totalStockUnits += p.currentStock;
          totalInventoryValue += (p.currentStock * p.retailPrice);
          totalCostValuation += (p.currentStock * p.costPrice);
          if (p.currentStock === 0) outOfStockCount++;
          else if (p.currentStock <= p.reorderPoint) lowStockCount++;

          if (p.auditStatus === 'audited' && p.lastAudited.startsWith(todayStr)) auditedTodayCount++;
          else if (p.auditStatus === 'discrepancy') discrepancyCount++;
        }

        return {
          totalSKUs,
          totalStockUnits,
          totalInventoryValue: Math.round(totalInventoryValue),
          totalCostValuation: Math.round(totalCostValuation),
          lowStockCount,
          outOfStockCount,
          auditedTodayCount,
          discrepancyCount,
          auditComplianceRate: totalSKUs > 0 ? parseFloat(((auditedTodayCount / totalSKUs) * 100).toFixed(1)) : 0
        };
      }

      reset() {
        this.products = generateSeedInventory();
        this.auditLogs = [];
        this.persist();
        this.persistLogs();
        return { count: this.products.length };
      }
    }

    const dbStore = new RelationalDatabaseStore();

    // Async REST API Wrapper (Simulating real HTTP request latency)
    const api = {
      async getProducts(params) {
        const start = performance.now();
        await new Promise(r => setTimeout(r, 20));
        const res = dbStore.query(params);
        const roundtrip = parseFloat((performance.now() - start).toFixed(2));
        return { ok: true, data: res, meta: { roundtripMs: roundtrip, dbQueryMs: res.executionMs, totalRecords: res.totalDatabaseRecords } };
      },
      async updateStock(id, qty) {
        const start = performance.now();
        await new Promise(r => setTimeout(r, 25));
        const product = dbStore.updateStock(id, qty);
        const roundtrip = parseFloat((performance.now() - start).toFixed(2));
        return { ok: true, data: product, meta: { roundtripMs: roundtrip } };
      },
      async reconcile(id, physicalCount, operator, notes) {
        const start = performance.now();
        await new Promise(r => setTimeout(r, 30));
        const res = dbStore.reconcile(id, physicalCount, operator, notes);
        const roundtrip = parseFloat((performance.now() - start).toFixed(2));
        return { ok: true, data: res, meta: { roundtripMs: roundtrip } };
      },
      async createProduct(data) {
        await new Promise(r => setTimeout(r, 30));
        return { ok: true, data: dbStore.create(data) };
      },
      async updateProduct(id, data) {
        await new Promise(r => setTimeout(r, 30));
        return { ok: true, data: dbStore.update(id, data) };
      },
      async deleteProduct(id) {
        await new Promise(r => setTimeout(r, 25));
        return { ok: true, data: dbStore.delete(id) };
      },
      async getMetrics() {
        await new Promise(r => setTimeout(r, 10));
        return { ok: true, data: dbStore.getMetrics() };
      },
      async getLogs() {
        await new Promise(r => setTimeout(r, 15));
        return { ok: true, data: dbStore.auditLogs };
      },
      async resetDb() {
        await new Promise(r => setTimeout(r, 40));
        return { ok: true, data: dbStore.reset() };
      }
    };

                  <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Total Stock Units</div>
                  <div className="text-2xl font-bold text-slate-900">{metrics.totalStockUnits.toLocaleString()}</div>
                  <div className="text-xs text-slate-500 mt-1">Physical units in store</div>
                </div>

                <div className="bg-white rounded-xl p-4 border border-slate-200 shadow-xs">
                  <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Valuation (Retail)</div>
                  <div className="text-2xl font-bold text-slate-900">${metrics.totalInventoryValue.toLocaleString()}</div>
                  <div className="text-xs text-slate-500 mt-1">Cost: ${metrics.totalCostValuation.toLocaleString()}</div>
                </div>

                <div onClick={() => { setStockFilter('low_stock'); setPage(1); }} className="bg-amber-50/50 rounded-xl p-4 border border-amber-200 shadow-xs cursor-pointer hover:border-amber-400 transition">
                  <div className="text-xs font-semibold uppercase tracking-wider text-amber-700 mb-1">Stock Alerts</div>
                  <div className="text-2xl font-bold text-amber-900">{metrics.lowStockCount} Low</div>
                  <div className="text-xs text-red-600 font-medium mt-1">{metrics.outOfStockCount} Out of stock</div>
                </div>

                <div onClick={() => { setStockFilter('pending_audit'); setPage(1); }} className="bg-white rounded-xl p-4 border border-slate-200 shadow-xs cursor-pointer hover:border-teal-400 transition">
                  <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Daily Audit Health</div>
                  <div className="text-2xl font-bold text-slate-900">{metrics.auditedTodayCount} Audited</div>
                  <div className="text-xs text-slate-500 mt-1">{metrics.auditComplianceRate}% verified • {metrics.discrepancyCount} variances</div>
                </div>
              </div>
            )}

            {/* Filter Toolbar */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-xs p-4 mb-6">
              <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-3 border-b border-slate-100">
                <div className="relative flex-1 max-w-lg">
                  <input
                    type="text"
                    value={searchQuery}
                    onChange={(e) => { setSearchQuery(e.target.value); setPage(1); }}
                    placeholder="Search 500+ items by SKU, name, barcode, supplier, aisle..."
                    className="w-full pl-3 pr-8 py-2 text-sm bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:border-indigo-500"
                  />
                  {searchQuery && (
                    <button onClick={() => setSearchQuery('')} className="absolute right-2.5 top-2.5 text-slate-400">✕</button>
                  )}
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  <select
                    value={stockFilter}
                    onChange={(e) => { setStockFilter(e.target.value); setPage(1); }}
                    className="text-xs bg-slate-50 border border-slate-200 py-1.5 px-2.5 rounded-lg text-slate-700 font-medium"
                  >
                    <option value="all">All Items</option>
                    <option value="in_stock">In Stock (Healthy)</option>
                    <option value="low_stock">⚠️ Low Stock (≤ Reorder)</option>
                    <option value="out_of_stock">🚫 Out of Stock (0)</option>
                    <option value="pending_audit">📋 Pending Daily Audit</option>
                    <option value="audited_today">✅ Audited Today</option>
                    <option value="discrepancy">⚡ Audit Discrepancies</option>
                  </select>

                  <select
                    value={sortBy}
                    onChange={(e) => setSortBy(e.target.value)}
                    className="text-xs bg-slate-50 border border-slate-200 py-1.5 px-2.5 rounded-lg text-slate-700 font-medium"
                  >
                    <option value="id">Default (ID)</option>
                    <option value="currentStock">Stock Level</option>
                    <option value="name">Product Name</option>
                    <option value="sku">SKU Code</option>
                    <option value="retailPrice">Retail Price</option>
                    <option value="inventoryValue">Inventory Value</option>
                  </select>

                  <button
                    onClick={() => setSortOrder(prev => prev === 'asc' ? 'desc' : 'asc')}
                    className="p-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs font-bold text-slate-600"
                    title="Toggle Sort Order"
                  >
                    {sortOrder === 'asc' ? '▲ Asc' : '▼ Desc'}
                  </button>
                </div>
              </div>

              {/* Category Pills */}
              <div className="flex items-center space-x-2 pt-3 overflow-x-auto no-scrollbar">
                <span className="text-xs font-semibold text-slate-400 whitespace-nowrap">Category:</span>
                <button
                  onClick={() => { setSelectedCat('all'); setPage(1); }}
                  className={`px-3 py-1 text-xs font-medium rounded-full transition whitespace-nowrap ${
                    selectedCat === 'all' ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                  }`}
                >
                  All (8)
                </button>
                {CATEGORIES.map(c => (
                  <button
                    key={c.id}
                    onClick={() => { setSelectedCat(c.id.toString()); setPage(1); }}
                    className={`px-3 py-1 text-xs font-medium rounded-full transition whitespace-nowrap ${
                      selectedCat === c.id.toString() ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                    }`}
                  >
                    {c.name}
                  </button>
                ))}
              </div>
            </div>

            {/* Inventory Table */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden mb-6">
              <div className="overflow-x-auto min-h-[400px]">
                <table className="w-full text-left text-sm border-collapse">
                  <thead>
                    <tr className="bg-slate-50 border-b border-slate-200 text-[11px] font-bold text-slate-500 uppercase tracking-wider">
                      <th className="py-3 px-4">SKU & Item Name</th>
                      <th className="py-3 px-4">Category</th>
                      <th className="py-3 px-4">Location</th>
                      <th className="py-3 px-4 min-w-[180px]">Inventory Level</th>
                      <th className="py-3 px-4 min-w-[140px]">Quick Quantity</th>
                      <th className="py-3 px-4">Price</th>
                      <th className="py-3 px-4">Daily Audit</th>
                      <th className="py-3 px-4 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100">
                    {isLoading ? (
                      <tr><td colSpan="8" className="py-12 text-center text-slate-400">Loading catalog records...</td></tr>
                    ) : items.length === 0 ? (
                      <tr><td colSpan="8" className="py-12 text-center text-slate-400">No items match the selected filters.</td></tr>
                    ) : (
                      items.map(item => {
                        const isLow = item.currentStock <= item.reorderPoint && item.currentStock > 0;
                        const isOut = item.currentStock === 0;
                        const maxCap = Math.max(item.reorderPoint * 3, item.currentStock, 30);
                        const pct = Math.min(100, Math.round((item.currentStock / maxCap) * 100));

                        return (
                          <tr key={item.id} className={`hover:bg-slate-50 transition ${isOut ? 'bg-red-50/20' : ''}`}>
                            <td className="py-3 px-4">
                              <div className="font-semibold text-slate-900 line-clamp-1">{item.name}</div>
                              <div className="text-xs text-slate-500 font-mono flex items-center space-x-2 mt-0.5">
                                <span className="bg-slate-100 px-1.5 py-0.2 rounded font-medium">{item.sku}</span>
                                <span className="text-slate-400">EAN: {item.barcode.slice(-6)}</span>
                              </div>
                            </td>

                            <td className="py-3 px-4 text-xs">
                              <span className="bg-slate-100 text-slate-700 px-2 py-0.5 rounded-md font-medium">{item.category}</span>
                            </td>

                            <td className="py-3 px-4 text-xs text-slate-600 truncate max-w-[120px]">
                              {item.location}
                            </td>

                            <td className="py-3 px-4">
                              <div className="space-y-1">
                                <div className="flex justify-between text-xs font-bold">
                                  <span className={isOut ? 'text-red-600' : isLow ? 'text-amber-700' : 'text-emerald-700'}>
                                    {item.currentStock} units
                                  </span>
                                  <span className="text-slate-400 text-[11px]">Min: {item.reorderPoint}</span>
                                </div>
                                <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                                  <div
                                    className={`h-2 rounded-full ${isOut ? 'bg-red-500' : isLow ? 'bg-amber-500' : 'bg-emerald-500'}`}
                                    style={{ width: `${pct}%` }}
                                  ></div>
                                </div>
                              </div>
                            </td>

                            <td className="py-3 px-4">
                              <div className="flex items-center space-x-1">
                                <button
                                  onClick={() => handleUpdateStock(item.id, Math.max(0, item.currentStock - 1))}
                                  disabled={item.currentStock <= 0 || updatingId === item.id}
                                  className="w-7 h-7 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-bold disabled:opacity-30"
                                >
                                  -
                                </button>
                                <span className="w-12 text-center text-xs font-bold text-slate-800 bg-slate-50 py-1 border border-slate-200 rounded">
                                  {updatingId === item.id ? '...' : item.currentStock}
                                </span>
                                <button
                                  onClick={() => handleUpdateStock(item.id, item.currentStock + 1)}
                                  disabled={updatingId === item.id}
                                  className="w-7 h-7 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded font-bold"
                                >
                                  +
                                </button>
                              </div>
                            </td>

                            <td className="py-3 px-4 text-xs font-semibold text-slate-800">
                              ${item.retailPrice.toFixed(2)}
                            </td>

                            <td className="py-3 px-4 text-xs">
                              {item.auditStatus === 'audited' ? (
                                <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-medium">✓ Audited</span>
                              ) : item.auditStatus === 'discrepancy' ? (
                                <span className="bg-orange-100 text-orange-800 px-2 py-0.5 rounded-full font-medium">Var: {item.discrepancyQty > 0 ? `+${item.discrepancyQty}` : item.discrepancyQty}</span>
                              ) : (
                                <span className="text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full font-medium">Pending</span>
                              )}
                            </td>

                            <td className="py-3 px-4 text-right">
                              <div className="flex items-center justify-end space-x-2">
                                <button
                                  onClick={() => setActiveAuditItem(item)}
                                  className="px-2.5 py-1 bg-teal-50 hover:bg-teal-100 text-teal-700 border border-teal-200 rounded-lg text-xs font-bold"
                                >
                                  Audit
                                </button>
                                <button
                                  onClick={() => { setProductModalItem(item); setIsProductModalOpen(true); }}
                                  className="text-slate-400 hover:text-slate-700 p-1"
                                  title="Edit"
                                >
                                  ✏️
                                </button>
                                <button
                                  onClick={() => handleDeleteProduct(item.id)}
                                  className="text-slate-400 hover:text-red-600 p-1"
                                  title="Delete"
                                >
                                  🗑️
                                </button>
                              </div>
                            </td>
                          </tr>
                        );
                      })
                    )}
                  </tbody>
                </table>
              </div>

              {/* Pagination */}
              <div className="bg-slate-50 border-t border-slate-200 px-4 py-3 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-2">
                <div>
                  Showing {items.length > 0 ? (page - 1) * (pageSize === 'all' ? totalCount : pageSize) + 1 : 0} to{' '}
                  {Math.min(page * (pageSize === 'all' ? totalCount : pageSize), totalCount)} of {totalCount} records
                </div>

                <div className="flex items-center space-x-2">
                  <span>Per page:</span>
                  <select
                    value={pageSize}
                    onChange={(e) => { setPageSize(e.target.value === 'all' ? 'all' : parseInt(e.target.value, 10)); setPage(1); }}
                    className="bg-white border border-slate-200 rounded px-2 py-0.5 text-xs font-medium"
                  >
                    <option value="15">15</option>
                    <option value="25">25</option>
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="all">All (500+)</option>
                  </select>

                  {pageSize !== 'all' && totalPages > 1 && (
                    <div className="flex items-center space-x-1 pl-3 border-l border-slate-200">
                      <button onClick={() => setPage(p => Math.max(1, p - 1))} disabled={page === 1} className="px-2 py-1 bg-white border rounded disabled:opacity-40">Prev</button>
                      <span className="px-2 font-medium">Page {page} / {totalPages}</span>
                      <button onClick={() => setPage(p => Math.min(totalPages, p + 1))} disabled={page >= totalPages} className="px-2 py-1 bg-white border rounded disabled:opacity-40">Next</button>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </main>

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-3 text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
              <div>StockTrack Pro • Managing 520+ retail records</div>
              <div className="flex space-x-3">
                <button onClick={handleResetDb} className="hover:text-indigo-600 font-medium">Re-seed Database</button>
                <span>•</span>
                <span className="text-emerald-600 font-bold">Sub-200ms Verified</span>
              </div>
            </div>
          </footer>

          {/* Audit Modal */}
          {activeAuditItem && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full shadow-2xl overflow-hidden p-6 animate-in zoom-in-95">
                <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                  <h3 className="font-bold text-slate-900 text-base">Daily Stock Audit Check</h3>
                  <button onClick={() => setActiveAuditItem(null)} className="text-slate-400">✕</button>
                </div>
                <div className="my-4 p-3 bg-slate-50 rounded-xl text-xs space-y-1">
                  <div className="font-bold text-slate-800">{activeAuditItem.name}</div>
                  <div className="text-slate-500 font-mono">{activeAuditItem.sku} • {activeAuditItem.location}</div>
                  <div className="text-slate-700 font-semibold">Current System Stock: {activeAuditItem.currentStock} units</div>
                </div>
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Physical Count Found</label>
                    <input
                      id="audit-physical-count"
                      type="number"
                      min="0"
                      defaultValue={activeAuditItem.currentStock}
                      className="w-full text-center py-2 text-2xl font-black border-2 border-slate-300 rounded-xl focus:border-teal-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Auditor Notes</label>
                    <input
                      id="audit-notes"
                      type="text"
                      placeholder="e.g. Verified packaging, shelf intact"
                      className="w-full text-xs px-3 py-2 border border-slate-300 rounded-lg"
                    />
                  </div>
                  <div className="flex justify-end space-x-2 pt-2">
                    <button onClick={() => setActiveAuditItem(null)} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-lg">Cancel</button>
                    <button
                      onClick={() => {
                        const count = parseInt(document.getElementById('audit-physical-count').value, 10);
                        const notes = document.getElementById('audit-notes').value;
                        handleReconcile(activeAuditItem.id, count, 'Alex Rivera (Auditor)', notes);
                        setActiveAuditItem(null);
                      }}
                      className="px-5 py-2 text-xs font-bold text-white bg-teal-600 rounded-lg shadow-sm hover:bg-teal-500"
                    >
                      Reconcile Count
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Add / Edit Product Modal */}
          {isProductModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full shadow-2xl overflow-hidden p-6 animate-in zoom-in-95">
                <div className="flex justify-between items-center pb-3 border-b border-slate-100">
                  <h3 className="font-bold text-slate-900 text-base">{productModalItem ? `Edit SKU: ${productModalItem.sku}` : 'Add New Inventory SKU'}</h3>
                  <button onClick={() => setIsProductModalOpen(false)} className="text-slate-400">✕</button>
                </div>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const form = e.target;
                    handleSaveProduct({
                      name: form.name.value,
                      categoryId: form.categoryId.value,
                      currentStock: form.currentStock.value,
                      reorderPoint: form.reorderPoint.value,
                      costPrice: form.costPrice.value,
                      retailPrice: form.retailPrice.value,
                      supplierId: form.supplierId.value,
                      location: form.location.value
                    }, productModalItem ? productModalItem.id : null);
                    setIsProductModalOpen(false);
                  }}
                  className="space-y-3 pt-3"
                >
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Product Title</label>
                    <input name="name" required defaultValue={productModalItem ? productModalItem.name : ''} className="w-full text-xs px-3 py-2 border rounded-lg" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Category</label>
                      <select name="categoryId" defaultValue={productModalItem ? productModalItem.categoryId : 1} className="w-full text-xs px-3 py-2 border rounded-lg">
                        {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">Supplier</label>
                      <select name="supplierId" defaultValue={productModalItem ? productModalItem.supplierId : 1} className="w-full text-xs px-3 py-2 border rounded-lg">
                        {SUPPLIERS.map(s => <option key={s.id} value={s.id}>{s.name}</option>)}
                      </select>
                    </div>
                  </div>
                  <div className="grid grid-cols-4 gap-2">
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 mb-1">Stock</label>
                      <input name="currentStock" type="number" min="0" required defaultValue={productModalItem ? productModalItem.currentStock : 25} className="w-full text-xs px-2 py-1.5 border rounded-lg" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 mb-1">Reorder</label>
                      <input name="reorderPoint" type="number" min="1" required defaultValue={productModalItem ? productModalItem.reorderPoint : 15} className="w-full text-xs px-2 py-1.5 border rounded-lg" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 mb-1">Cost ($)</label>
                      <input name="costPrice" type="number" step="0.01" required defaultValue={productModalItem ? productModalItem.costPrice : 12.50} className="w-full text-xs px-2 py-1.5 border rounded-lg" />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold text-slate-700 mb-1">Retail ($)</label>
                      <input name="retailPrice" type="number" step="0.01" required defaultValue={productModalItem ? productModalItem.retailPrice : 24.99} className="w-full text-xs px-2 py-1.5 border rounded-lg" />
                    </div>
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">Store Location</label>
                    <input name="location" defaultValue={productModalItem ? productModalItem.location : 'Aisle 3, Rack B'} className="w-full text-xs px-3 py-2 border rounded-lg" />
                  </div>
                  <div className="flex justify-end space-x-2 pt-2 border-t">
                    <button type="button" onClick={() => setIsProductModalOpen(false)} className="px-4 py-2 text-xs font-bold text-slate-600 bg-slate-100 rounded-lg">Cancel</button>
                    <button type="submit" className="px-5 py-2 text-xs font-bold text-white bg-indigo-600 rounded-lg">Save SKU</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Audit History Drawer */}
          {isAuditDrawerOpen && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex justify-end">
              <div className="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-4 animate-in slide-in-from-right">
                <div className="flex justify-between items-center pb-3 border-b border-slate-200">
                  <h3 className="font-bold text-slate-900 text-sm">Audit Trail ({auditLogs.length} Records)</h3>
                  <button onClick={() => setIsAuditDrawerOpen(false)} className="text-slate-400">✕</button>
                </div>
                <div className="flex-1 overflow-y-auto py-3 space-y-3">
                  {auditLogs.length === 0 ? (
                    <div className="text-center py-10 text-slate-400 text-xs">No audit logs recorded yet.</div>
                  ) : (
                    auditLogs.map(log => (
                      <div key={log.id} className="p-3 bg-slate-50 border rounded-xl text-xs space-y-1">
                        <div className="flex justify-between font-bold">
                          <span className="font-mono text-indigo-600">{log.sku}</span>
                          <span className={log.discrepancy === 0 ? 'text-emerald-700' : 'text-orange-700'}>
                            {log.discrepancy === 0 ? 'Matched' : `Var: ${log.discrepancy > 0 ? `+${log.discrepancy}` : log.discrepancy}`}
                          </span>
                        </div>
                        <div className="text-slate-800 font-semibold">{log.productName}</div>
                        <div className="text-slate-500">Physical: {log.physicalCount} (Sys: {log.systemCount})</div>
                        {log.notes && <div className="text-slate-400 italic">"{log.notes}"</div>}
                        <div className="text-[10px] text-slate-400 pt-1 flex justify-between">
                          <span>{log.operatorName}</span>
                          <span>{new Date(log.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Floating Performance Monitor (Sub-200ms Guarantee) */}
          <div className="fixed bottom-4 right-4 z-40 bg-slate-900/95 text-white px-3.5 py-2 rounded-full shadow-lg border border-slate-700 text-xs font-semibold flex items-center space-x-2">
            <span className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
            <span>SLA: <strong className="text-emerald-400 font-mono">{pageLoadTimeMs}ms</strong></span>
            <span className="text-slate-400 text-[10px]">| DB: {lastDbQueryMs}ms | {totalRecords} items</span>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
